apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamingapp.fullname" . }}-chat
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  replicas: {{ .Values.services.chat.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "streamingapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chat
  template:
    metadata:
      labels:
        {{- include "streamingapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chat
    spec:
      containers:
        - name: chat
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.chat.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.chat.port }}
          env:
            - name: PORT
              value: {{ .Values.services.chat.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "streamingapp.fullname" . }}-config
            - secretRef:
                name: {{ include "streamingapp.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: {{ .Values.services.chat.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.services.chat.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.services.chat.resources | nindent 12 }}
