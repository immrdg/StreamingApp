apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamingapp.fullname" . }}-streaming
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: streaming
spec:
  replicas: {{ .Values.services.streaming.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "streamingapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: streaming
  template:
    metadata:
      labels:
        {{- include "streamingapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: streaming
    spec:
      serviceAccountName: {{ include "streamingapp.fullname" . }}-streaming
      containers:
        - name: streaming
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.streaming.image }}:{{ .Values.imageTags.streaming | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.streaming.port }}
          env:
            - name: PORT
              value: {{ .Values.services.streaming.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "streamingapp.fullname" . }}-config
            - secretRef:
                name: {{ include "streamingapp.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: {{ .Values.services.streaming.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.services.streaming.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.services.streaming.resources | nindent 12 }}
